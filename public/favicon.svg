<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Blueprint Grid Subtle Backing -->
  <rect width="120" height="120" rx="24" fill="#0A0D14"/>
  
  <!-- Architectural Geometric Framework -->
  <circle cx="60" cy="60" r="46" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  
  <!-- Cyan/Blue Triangular Beam & Structure -->
  <path d="M60 22 L94 88 H26 Z" stroke="#0EA5E9" stroke-width="4.5" stroke-linejoin="round" fill="none" />
  
  <!-- Red Accent Triangle / Drafting Elevation Node -->
  <path d="M60 38 L80 78 H40 Z" fill="#DC2626" opacity="0.9" />
  <circle cx="60" cy="38" r="4.5" fill="#EF4444" />
  
  <!-- Modern Geometric 'E' Overlay in White -->
  <path d="M48 52 H68 M48 62 H62 M48 72 H68" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M48 52 V72" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Base Ground Level Line in Red & Blue -->
  <line x1="20" y1="96" x2="72" y2="96" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="76" y1="96" x2="100" y2="96" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="100" cy="96" r="3" fill="#DC2626" />
</svg>